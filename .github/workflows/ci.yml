name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Seed demo database
        # demo.db is gitignored, but the smoke/e2e suites run against it —
        # without a seed, sqlite creates an empty file and table lookups fail.
        run: node scripts/make-demo-sqlite.mjs

      - name: Tests (130+ checks, mocked LLMs — no API keys needed)
        run: npm test
