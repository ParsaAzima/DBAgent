# ── DBAgent configuration ─────────────────────────────────────
# Copy to `dbagent.toml` (project root) or `~/.dbagent/config.toml`.
# NEVER commit a file with real secrets — dbagent.toml is gitignored.
#
# Precedence for every setting:
#   CLI flags  >  environment variables (.env still works)  >  this file  >  defaults
#
# Secrets: use ${VAR} / ${VAR:-fallback} to pull from the environment
# instead of writing keys in plain text.

[llm]
provider = "openrouter" # openai | openrouter | anthropic | gemini | ollama
model = "openai/gpt-4o-mini" # "vendor/model" on OpenRouter, e.g. anthropic/claude-sonnet-4
temperature = 0.1
max_output_tokens = 2048
api_key = "${OPENROUTER_API_KEY}" # key for the active provider
base_url = "" # optional override (e.g. a local gateway); empty = provider default

[llm.openrouter]
site_url = "" # optional attribution headers sent to OpenRouter
app_name = "DBAgent"

[llm.gemini]
api_version = "v1beta"

[database]
url = "sqlite://./demo.db"
# url = "postgres://user:pass@localhost:5432/app?ssl=true"
# url = "mysql://user:pass@localhost:3306/app"
# url = "sqlserver://user:pass@localhost:1433/app"

[safety]
allow_writes = false # INSERT/UPDATE/DELETE (each pauses for human y/n)
allow_system = false # stats/export/import/backup/discover + file tools
allow_shell = false # bash tool — use with care
assume_yes = false # auto-confirm writes (DANGEROUS, scripts/CI only)
allow_ddl = "off" # off | dry-run (analyze) | on (apply CREATE INDEX + confirm)
mask_pii = true # mask email/phone/secrets in results (unmask: true is audited)

[schema]
embed_model = "" # search_tables model (default: text-embedding-3-small, nomic-embed-text on Ollama)
large_tables = 30 # above this count the prompt navigates via search_tables

[limits]
max_rows = 100 # hard LIMIT for read queries
max_rounds = 12 # max model tool-loop rounds per turn
timeout_ms = 120000

[output]
dir = "dbagent-out" # exports/backups land here
audit_file = "~/.dbagent/audit.log" # every SQL statement is logged here
allow_any_path = false # allow file paths outside cwd (DANGEROUS)
